<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#02070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FCC Phone" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Your own AI agents, models, and memory, on your phone." />
    <title>FCC Phone</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="stylesheet" href="phone.css" />
  </head>
  <body data-route="home">
    <header class="bar">
      <button id="back" class="ghost" type="button" aria-label="Back" hidden>‹</button>
      <h1 id="title">FCC Phone</h1>
      <span id="link-pill" class="pill" hidden></span>
    </header>

    <main id="view" class="view" aria-live="polite">
      <noscript><p class="warn">FCC Phone needs JavaScript.</p></noscript>
    </main>

    <nav class="tabs" aria-label="Sections">
      <button class="tab" type="button" data-route="home"><span aria-hidden="true">◆</span>Home</button>
      <button class="tab" type="button" data-route="chats"><span aria-hidden="true">◌</span>Chats</button>
      <button class="tab" type="button" data-route="agents"><span aria-hidden="true">◎</span>Agents</button>
      <button class="tab" type="button" data-route="models"><span aria-hidden="true">⚡</span>Models</button>
      <button class="tab" type="button" data-route="more"><span aria-hidden="true">⋯</span>More</button>
    </nav>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-backdrop" data-close></div>
      <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <header class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button class="ghost" type="button" data-close aria-label="Close">✕</button>
        </header>
        <div id="sheet-body"></div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
