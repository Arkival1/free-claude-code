# FCC for iPhone: the Xcode project, generated by XcodeGen on GitHub's Mac
# (.github/workflows/fcc-ios-app.yml), so no Mac is needed here.
name: FCC
options:
  bundleIdPrefix: app.fcc
  deploymentTarget:
    iOS: "16.0"
targets:
  FCC:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fcc.phone
        PRODUCT_NAME: FCC
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
