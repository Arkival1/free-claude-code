# CodeRabbit review settings for FCC (owner, 6 November 2026: "use it on
# FCC mobile"). Reviews focus on FCC Mobile's source; generated copies,
# vendored code, binaries and Content Farm are left out.
language: en-AU
reviews:
  profile: chill
  auto_review:
    enabled: true
    # The implementer opens a draft pull request for review only (never merged
    # by CodeRabbit or the AI), so drafts are reviewed too.
    drafts: true
    # The review-only pull request targets this branch, not main.
    base_branches:
      - "coderabbit/.*"
  path_filters:
    - "!docs/**"
    - "!vendor/**"
    - "!**/*.bin"
    - "!**/*.pack"
    - "!**/*.zip"
    - "!**/*.gz"
    - "!**/*.ttf"
    - "!**/*.png"
    - "!**/*.wasm"
    - "!uv.lock"
    # Generated by scripts/phone/build_pages.py (review the generator instead).
    - "!src/free_claude_code/api/phone_static/js/art2d.js"
    - "!src/free_claude_code/api/phone_static/js/apis.js"
    - "!src/free_claude_code/api/phone_static/js/skills.js"
    - "!src/free_claude_code/api/phone_static/js/templates.js"
    - "!src/free_claude_code/api/phone_static/godot/starters.js"
    - "!src/free_claude_code/api/phone_static/godot/kit.js"
    - "!src/free_claude_code/api/phone_static/lab/science-data.js"
    - "!src/free_claude_code/api/phone_static/lab/tutorials-data.js"
    # Content Farm: the owner's call, kept exactly as it is.
    - "!src/free_claude_code/studio/farm/**"
    - "!**/farm.js"
    - "!**/farm.css"
    - "!tests/studio/test_content_farm*.py"
    - "!e2e/test_content_farm.py"
  path_instructions:
    - path: "src/free_claude_code/api/phone_static/**"
      instructions: >-
        FCC Mobile: a plain-JavaScript PWA (ES modules, no build step) that runs
        on an iPhone in Safari/WebKit. Look for bugs a phone user would hit:
        module syntax errors, unhandled promise rejections, IndexedDB/Cache
        API misuse, service worker caching of files that must update, memory
        on a 6 GB iPhone, touch and small-screen layout. Keys (cloud AI keys,
        plugin keys, the GitHub token) must stay on the phone: never sent to a
        model, logged, or put in backups. Godot games and FCC Linux run in
        sealed iframes with no network; flag anything that weakens the
        sandbox or content security policy.
    - path: "src/free_claude_code/studio/godot/**"
      instructions: >-
        Godot 4.7 GDScript for FCC's starters and kit; it must also run in
        Godot's single-threaded web player on the phone (no threads,
        Compatibility renderer).
    - path: "src/free_claude_code/studio/trading/**"
      instructions: >-
        Trading Bank: a change may only add a check or make one stricter (the
        owner's no-downgrade rule); flag anything that loosens a safety check.
