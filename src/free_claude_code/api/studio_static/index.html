<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Studio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>FCC Studio</title>
    <link rel="manifest" href="/studio/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/studio/assets/__FCC_VERSION__/icon.svg" />
    <link rel="icon" href="/studio/assets/__FCC_VERSION__/icon.svg" />
    <link rel="stylesheet" href="/studio/assets/__FCC_VERSION__/studio.css" />
  </head>
  <body>
    <header class="app-bar">
      <button id="back-button" class="ghost-button" hidden aria-label="Back">‹</button>
      <h1 id="view-title">Studio</h1>
      <button id="guide-button" class="ghost-button" aria-label="Ask the guide">?</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tab-bar" aria-label="Sections">
      <button class="tab" data-route="home" aria-current="page">
        <span class="tab-glyph">◆</span><span class="tab-label">Home</span>
      </button>
      <button class="tab" data-route="chats">
        <span class="tab-glyph">◌</span><span class="tab-label">Chats</span>
      </button>
      <button class="tab" data-route="agents">
        <span class="tab-glyph">◎</span><span class="tab-label">Agents</span>
      </button>
      <button class="tab" data-route="learn">
        <span class="tab-glyph">◈</span><span class="tab-label">Learn</span>
      </button>
      <button class="tab" data-route="more">
        <span class="tab-glyph">⋯</span><span class="tab-label">More</span>
      </button>
    </nav>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-backdrop" data-close-sheet></div>
      <section class="sheet-panel" role="dialog" aria-modal="true">
        <header class="sheet-head">
          <h2 id="sheet-title">Settings</h2>
          <button class="ghost-button" data-close-sheet aria-label="Close">✕</button>
        </header>
        <div id="sheet-body" class="sheet-body"></div>
      </section>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/studio/assets/__FCC_VERSION__/studio.js"></script>
  </body>
</html>
