<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02070d" />
    <meta name="color-scheme" content="dark" />
    <title>Jarvis</title>
    <link rel="manifest" href="/studio/manifest.webmanifest" />
    <link rel="icon" href="/studio/assets/__FCC_VERSION__/icon-192.png" />
    <link rel="stylesheet" href="/studio/assets/__FCC_VERSION__/orb.css" />
  </head>
  <body>
    <header class="orb-top">
      <div class="orb-title">
        <strong>JARVIS</strong>
        <span id="orb-status" class="orb-status">Starting…</span>
      </div>
      <div id="pc-guard" class="pc-guard" hidden>
        <button id="pc-stop" class="pc-stop" type="button">■ Stop Jarvis</button>
        <button id="pc-panel" class="pc-panel-button" type="button" aria-label="Jarvis's PC">PC</button>
      </div>
      <button id="orb-setup" class="orb-ghost" type="button" aria-label="Jarvis and his advisers">⚙</button>
    </header>

    <main class="orb-main">
      <section class="orb-core" aria-label="Jarvis">
        <canvas id="orb-canvas" class="orb-canvas" aria-hidden="true"></canvas>
        <div id="orb-advisers" class="orb-advisers" aria-label="Advisers"></div>
      </section>
      <section id="orb-approvals" class="orb-approvals" aria-label="Waiting for your OK" hidden></section>
      <ol id="orb-log" class="orb-log" aria-live="polite"></ol>
    </main>

    <form id="orb-form" class="orb-form" autocomplete="off">
      <label class="orb-with">
        <input id="orb-with-advisers" type="checkbox" />
        <span>Ask my advisers</span>
      </label>
      <div class="orb-say">
        <textarea id="orb-input" rows="1" placeholder="Talk to Jarvis…" aria-label="Talk to Jarvis" enterkeyhint="send"></textarea>
        <button id="orb-send" class="orb-send" type="submit">Send</button>
      </div>
    </form>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-backdrop" data-close-sheet></div>
      <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <header class="sheet-head">
          <h2 id="sheet-title">Settings</h2>
          <button class="orb-ghost" type="button" data-close-sheet aria-label="Close">✕</button>
        </header>
        <div id="sheet-body" class="sheet-body"></div>
      </section>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/studio/assets/__FCC_VERSION__/core-orb.js"></script>
    <script src="/studio/assets/__FCC_VERSION__/orb.js"></script>
  </body>
</html>
